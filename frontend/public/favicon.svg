<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left bracket gradient (Blue to Indigo/Purple) -->
    <linearGradient id="leftBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f75ff" />
      <stop offset="100%" stop-color="#9353d3" />
    </linearGradient>

    <!-- Right bracket gradient (Blue to Purple) -->
    <linearGradient id="rightBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Background squircle shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect 
    x="16" 
    y="16" 
    width="480" 
    height="480" 
    rx="116" 
    fill="#0f1422" 
    filter="url(#glow)" 
  />

  <!-- Top Orange/Amber Accent Dot -->
  <circle 
    cx="256" 
    cy="140" 
    r="19" 
    fill="#f59e0b" 
  />

  <!-- Left Angle Bracket < -->
  <path 
    d="M 190 148 L 98 256 L 190 364" 
    fill="none" 
    stroke="url(#leftBracketGrad)" 
    stroke-width="48" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Right Angle Bracket > -->
  <path 
    d="M 322 148 L 414 256 L 322 364" 
    fill="none" 
    stroke="url(#rightBracketGrad)" 
    stroke-width="48" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Center Emerald Checkmark -->
  <path 
    d="M 216 270 L 254 312 L 328 186" 
    fill="none" 
    stroke="#10b981" 
    stroke-width="42" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>